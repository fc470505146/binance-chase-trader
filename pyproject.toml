[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "binance-chase-trader"
version = "0.1.0"
description = "🍗 Binance Futures 最优价格下单工具 — QUEUE限价 + 实时追单 + 自动止盈止损"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
keywords = ["binance", "futures", "trading", "crypto"]

[project.scripts]
binance-chase = "binance_chase.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
